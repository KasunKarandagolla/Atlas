[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "ATLAS V1 foundation: typed execution/protection contracts and SQLite durable journal (Phase 0/1, no live orders)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED - private research foundation" }
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.0",
  "ruff>=0.4",
  "mypy>=1.0",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: opt-in live/network tests (skipped by default)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM102", "SIM105"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = false
