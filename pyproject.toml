[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "2.0.0.dev25"
description = "ATLAS V2 causal crypto research and read-only public shadow desktop; capital disabled"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED - private research foundation" }
dependencies = [
  "pyyaml>=6.0",
  "pyarrow>=25.0.1",
  "duckdb>=1.5.5",
  "nautilus-trader==2.0.0rc5",
  "websockets==17.0.1",
]

[project.optional-dependencies]
offline-research = ["lightgbm==4.7.0"]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.0",
  "ruff>=0.4",
  "mypy>=1.0",
  "pyyaml>=6.0",
]
desktop = [
  "PySide6>=6.10,<7",
  "pyqtgraph>=0.14,<0.15",
  "pyinstaller>=6.22,<7",
]

[project.scripts]
atlas-v2-projection = "atlas.v2.desktop.ipc:main"
atlas-desktop = "atlas.desktop.app:main"
atlas-v2-public-qualification = "atlas.v2.data.qualification:main"
atlas-v2-public-soak = "atlas.v2.data.soak:main"
atlas-agent-worker = "atlas.v2.agent_intelligence.worker:worker_main"
atlas-agent-broker = "atlas.v2.agent_intelligence.broker:broker_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "tests", "."]
markers = ["integration: opt-in live/network tests (skipped by default)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM102", "SIM105"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_configs = true
show_error_codes = true
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = false
