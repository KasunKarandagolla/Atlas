name: Windows product build and offline qualification

on:
  push:
    branches:
      - impl/session-036-final-development-closure-windows-tune-ready
  workflow_dispatch:
    inputs:
      signed_release:
        description: Produce owner release using protected Authenticode certificate
        type: boolean
        default: false
      installer_version:
        description: Four-component version for Windows installer
        type: string
        default: 2.0.36.0

permissions:
  contents: read

concurrency:
  group: windows-product-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.10
      - name: Install exact offline validation dependencies
        run: python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r requirements-lock.txt
      - name: Validate complete offline regression and static gates
        run: |
          mkdir -p validation
          python -m pytest tests --junitxml=validation/offline-regression.xml
          ruff check src scripts tests
          mypy src/atlas scripts
          python -m compileall -q src scripts tests
          python -m pip check
      - name: Retain offline validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-offline-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: validation/
  build:
    needs: offline
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.10
          architecture: x64
      - name: Create isolated wheel-only build environment
        run: |
          python -m venv "$env:RUNNER_TEMP\atlas-build-env"
          & "$env:RUNNER_TEMP\atlas-build-env\Scripts\python.exe" -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r requirements-windows-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Hash-locked wheel installation failed' }
          & "$env:RUNNER_TEMP\atlas-build-env\Scripts\python.exe" -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Installed dependency graph invalid' }
      - name: Install pinned Inno Setup compiler on build host
        run: |
          $installer = "$env:RUNNER_TEMP\innosetup-6.5.4.exe"
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_5_4/innosetup-6.5.4.exe' -OutFile $installer
          $expected = 'fa73bf47a4da250d185d07561c2bfda387e5e20db77e4570004cf6a133cc10b1'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Compiler installer hash mismatch' }
          $destination = "$env:RUNNER_TEMP\inno-6.5.4"
          $process = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed' }
      - name: Qualify offline sustained public stream with real persistence
        env:
          ATLAS_S38_REALTIME_STREAM: '1'
          ATLAS_S38_REALTIME_SECONDS: '120'
        run: |
          $testTools = "$env:RUNNER_TEMP\atlas-stream-test-tools"
          & "$env:RUNNER_TEMP\atlas-build-env\Scripts\python.exe" -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes --target $testTools -r requirements-stream-test-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Hash-locked regression tools installation failed' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:PYTHONPATH = "$testTools;$pwd\src"
          @{cpu = (Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors); memory_bytes = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory; source_sha = '${{ github.sha }}'; provider_calls = 0} | ConvertTo-Json -Depth 4 | Set-Content dist/windows-stream-host.json
          & "$env:RUNNER_TEMP\atlas-build-env\Scripts\python.exe" -m pytest -q -s tests/v2/test_s38_sustained_public_stream.py tests/v2/test_session038_history_service.py tests/v2/test_session038_stream_identity_cache.py tests/v2/test_session038_serviced_acquisition.py tests/v2/test_session038_transport_archive.py tests/v2/test_session038_report_worker.py tests/v2/test_session038_public_http_session.py tests/v2/test_session032_public_stream_integration.py --junitxml=dist/windows-stream-regression.xml 2>&1 | Tee-Object dist/windows-stream-regression.txt
          if ($LASTEXITCODE -ne 0) { throw 'Offline stream regression failed; no package qualification' }
      - name: Build, validate payload and exercise offline product
        env:
          ATLAS_SIGNING_PFX_BASE64: ${{ inputs.signed_release && secrets.ATLAS_SIGNING_PFX_BASE64 || '' }}
          ATLAS_SIGNING_PASSWORD: ${{ inputs.signed_release && secrets.ATLAS_SIGNING_PASSWORD || '' }}
          SIGNED_RELEASE: ${{ inputs.signed_release || false }}
          INSTALLER_VERSION: ${{ inputs.installer_version || '2.0.36.0' }}
        run: |
          $arguments = @('scripts/windows_build.py', '--iscc', "$env:RUNNER_TEMP\inno-6.5.4\ISCC.exe", '--installer-version', $env:INSTALLER_VERSION)
          if ($env:SIGNED_RELEASE -eq 'true') { $arguments += '--signed-release' }
          & "$env:RUNNER_TEMP\atlas-build-env\Scripts\python.exe" @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Native product build failed' }
      - name: Validate installer, reinstall and uninstall preservation
        run: |
          $manifest = Get-Content dist/windows-release-manifest.json | ConvertFrom-Json
          & "$env:RUNNER_TEMP\atlas-build-env\Scripts\python.exe" scripts/windows_install_smoke.py --installer "dist/$($manifest.installer)" --output dist/windows-installer-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Installer lifecycle validation failed' }
      - name: Archive exact artifact and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/ATLAS-*-win11-x64-setup.exe
            dist/windows-*.json
            dist/windows-stream-regression.xml
            dist/windows-stream-regression.txt
            dist/atlas-product/build-manifest.json
            build/atlas-product/warn-atlas-product.txt
