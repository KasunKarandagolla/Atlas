name: S40 owner-scale strict native export qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-scale-export:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.10
          architecture: x64
      - name: Install exact native runtime and fixture dependencies
        run: |
          python -m venv "$env:RUNNER_TEMP\atlas-owner-scale-env"
          & "$env:RUNNER_TEMP\atlas-owner-scale-env\Scripts\python.exe" -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r requirements-windows-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Native lock installation failed' }
          $testTools = "$env:RUNNER_TEMP\atlas-owner-scale-tools"
          & "$env:RUNNER_TEMP\atlas-owner-scale-env\Scripts\python.exe" -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes --target $testTools -r requirements-stream-test-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Fixture lock installation failed' }
          "PYTHONPATH=$testTools;$pwd\src;$pwd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate complete cold commissioning-sized strict export
        run: |
          New-Item -ItemType Directory -Force validation | Out-Null
          $root = "$env:RUNNER_TEMP\atlas-s40-owner-scale-export"
          & "$env:RUNNER_TEMP\atlas-owner-scale-env\Scripts\python.exe" docs/v2/benchmarks/session040_owner_scale_export_v1.py --root $root 2>&1 | Tee-Object validation/owner-scale-export.txt
          $probeExit = $LASTEXITCODE
          if (Test-Path "$root\owner-scale-export-result.json") { Copy-Item "$root\owner-scale-export-result.json" validation/ }
          if ($probeExit -ne 0) { throw 'Owner-scale strict export margin gate failed' }
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-owner-scale-export-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: validation/
